<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']}};</script>

<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2333;--mut:#5b6478;--acc:#2f5fd0;--acc2:#e8eefc;--bd:#d9deea;--ok:#177a43;--err:#b3261e}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:linear-gradient(135deg,#1f3b8f,#2f5fd0);color:#fff;padding:20px 24px}
header h1{margin:0;font-size:1.45rem}header p{margin:4px 0 0;opacity:.85;font-size:.92rem}
main{max-width:1050px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h2{margin:0 0 10px;font-size:1.05rem;color:var(--acc)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:3px}
.hint{font-weight:400;color:var(--mut);font-size:.78rem}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:#fff}

#status{font-size:.85rem;color:var(--mut);margin-left:12px}#status.ok{color:var(--ok)}#status.err{color:var(--err)}
.step{border-left:4px solid var(--acc);padding-left:12px}
.res{background:var(--acc2);border-radius:10px;padding:10px 14px;font-size:1.1rem;overflow-x:auto}
pre{background:#101828;color:#e6edf7;padding:12px;border-radius:8px;overflow-x:auto;font-size:.85rem;margin:8px 0}
pre.out{background:#0b2a1b;color:#c8f7d9}
.err{color:var(--err);font-weight:600}.fn{font-size:.88rem;margin:3px 0}.fn code{background:var(--acc2);padding:1px 5px;border-radius:4px}
.chart{width:100%;max-width:640px;height:auto}.chart .bar{fill:#9db6ef}.chart .hl{fill:#2f5fd0;fill-opacity:.8}.chart .curve{fill:none;stroke:#1f3b8f;stroke-width:2}
.chart text{font-size:11px;fill:#5b6478}.chart .ax{stroke:#8a93a8;stroke-width:1}.chart .pt{fill:#d0442f}.chart .ln{stroke:#2f5fd0;stroke-width:2}

.tooltip:hover .tt-text{visibility:visible;opacity:1}
mjx-container[display=true]{overflow-x:auto;overflow-y:hidden;margin:.6em 0!important}

</main>

<script id="defs">
/* ===================== POMOĆNE FUNKCIJE ===================== */
const L=String.raw;
const grp=s=>s.replace(/\B(?=(\d{3})+(?!\d))/g,'\\,');
function F(x,d=6){x=Number(x);if(Number.isNaN(x))return '\\text{NA}';if(!isFinite(x))return x>0?'\\infty':'-\\infty';if(x===0)return '0';
 if(Number.isInteger(x)&&Math.abs(x)<1e15)return (x<0?'-':'')+grp(String(Math.abs(x)));
 const a=Math.abs(x);if(a<1e-4||a>=1e15){const [m,e]=x.toExponential(d-1).split('e');return `${+m}\\cdot10^{${+e}}`;}
 return String(+x.toPrecision(d));}
const FP=(x,d)=>x<0?`(${F(x,d)})`:F(x,d);
const escH=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const tx=s=>String(s).replace(/[\\{}$&#_%^~]/g,m=>({'\\':'\\textbackslash ','^':'\\textasciicircum ','~':'\\textasciitilde '}[m]||'\\'+m));
const lst=(a,max=8,sep=' + ')=>a.length<=max?a.join(sep):[...a.slice(0,max-2),'\\ldots',a[a.length-1]].join(sep);
const rs=s=>'"'+String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"';
const rv=a=>`c(${a.join(', ')})`;
const sum=a=>a.reduce((s,z)=>s+z,0);
const T=(id,lbl,def,hint,show,tt)=>({id,lbl,kind:'text',def,hint,show,tt});
const N=(id,lbl,def,hint,show,tt)=>({id,lbl,kind:'num',def,hint,show,tt});
const S=(id,lbl,opts,def,show,tt)=>({id,lbl,kind:'sel',opts,def,show,tt});
const A=(id,lbl,def,hint,show,tt)=>({id,lbl,kind:'area',def,hint,show,tt});

function makeG(vals,fields){
 const lab=id=>(fields.find(f=>f.id===id)||{}).lbl||id;
 const raw=id=>String(vals[id]??'').trim();
 const bad=(id,m)=>{throw new Error(`Polje „${lab(id)}“: ${m}`)};
 const chk=(id,v,o)=>{if(o.int&&!Number.isInteger(v))bad(id,`„${v}“ mora biti cijeli broj`);
  if(o.min!==undefined&&v<o.min)bad(id,`vrijednost mora biti ≥ ${o.min}`);if(o.max!==undefined&&v>o.max)bad(id,`vrijednost mora biti ≤ ${o.max}`);
  if(o.gt!==undefined&&v<=o.gt)bad(id,`vrijednost mora biti > ${o.gt}`);};
 const g={raw,bad,sel:raw,
  num(id,o={}){const s=raw(id);if(s==='')bad(id,'unesite broj');const v=Number(s);if(!isFinite(v))bad(id,`„${s}“ nije valjan broj (koristite decimalnu točku)`);chk(id,v,o);return v;},
  numOpt(id,o={}){return raw(id)===''?null:g.num(id,o);},
  toks(id){return raw(id).split(/[\s,;]+/).filter(t=>t!=='');},
  vec(id,o={}){const {min:cnt=1,...vo}=o;const t=g.toks(id);if(t.length<cnt)bad(id,`potrebno je barem ${cnt} vrijednosti`);
   return t.map(s=>{const v=Number(s);if(!isFinite(v))bad(id,`„${s}“ nije broj`);chk(id,v,vo);return v;});}};
 return g;}

function parseOut(raw){const V={},out=[];for(const l of raw.split('\n')){const m=l.match(/^@@(\w+)=(.*)$/);if(m)V[m[1]]=m[2]===''?[]:m[2].split(',');else out.push(l);}return{V,text:out.join('\n').trim()};}
const pn=s=>s==='Inf'?Infinity:s==='-Inf'?-Infinity:Number(s);
const mkV=V=>({s:k=>V[k]||[],a:k=>(V[k]||[]).map(pn),x:k=>pn((V[k]||[])[0])});
const PRE=`rm(list = ls())\nH <- function(k, v) cat("@@", k, "=", paste(vapply(v, function(z) if (is.character(z)) z else format(z, digits = 12, trim = TRUE), ""), collapse = ","), "\\n", sep = "")\n`;

/* ===================== GRAFOVI (SVG) ===================== */
const tf=v=>String(+Number(v).toPrecision(3));
function plot(xr,yr,draw,xl='',yl=''){
 const W=620,H=300,m={l:52,r:16,t:14,b:38};
 const sx=v=>+(m.l+(v-xr[0])/((xr[1]-xr[0])||1)*(W-m.l-m.r)).toFixed(2),sy=v=>+(H-m.b-(v-yr[0])/((yr[1]-yr[0])||1)*(H-m.t-m.b)).toFixed(2);
 let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
 s+=draw(sx,sy);
 s+=`<line class="ax" x1="${m.l}" y1="${H-m.b}" x2="${W-m.r}" y2="${H-m.b}"/><line class="ax" x1="${m.l}" y1="${m.t}" x2="${m.l}" y2="${H-m.b}"/>`;
 for(let i=0;i<=5;i++){const xv=xr[0]+(xr[1]-xr[0])*i/5,yv=yr[0]+(yr[1]-yr[0])*i/5;
  s+=`<text x="${sx(xv)}" y="${H-m.b+14}" text-anchor="middle">${tf(xv)}</text><text x="${m.l-5}" y="${sy(yv)+4}" text-anchor="end">${tf(yv)}</text>`;}
 s+=`<text x="${(W+m.l)/2}" y="${H-4}" text-anchor="middle">${xl}</text><text x="12" y="${m.t+8}">${yl}</text></svg>`;return s;}
function chartDist(v,disc,typ,q1,q2){
 const gx=v.a('gx'),gy=v.a('gy');if(!gx.length)return '';const qv=v.x('q');
 const inR=x=>({eq:disc&&x===q1,le:x<=q1,lt:disc?x<q1:x<=q1,ge:x>=q1,gt:disc?x>q1:x>=q1,between:x>=q1&&x<=q2,quant:x<=qv}[typ]);
 const ymax=Math.max(...gy)*1.1||1;
 if(disc){const dx=gx.length>1?gx[1]-gx[0]:1;
  return plot([gx[0]-dx,gx[gx.length-1]+dx],[0,ymax],(sx,sy)=>gx.map((k,i)=>`<rect class="${inR(k)?'hl':'bar'}" x="${sx(k-.4*dx)}" y="${sy(gy[i])}" width="${Math.max(1,sx(k+.4*dx)-sx(k-.4*dx))}" height="${sy(0)-sy(gy[i])}"/>`).join(''),'k','P(X = k)');}
 return plot([gx[0],gx[gx.length-1]],[0,ymax],(sx,sy)=>{
  const sh=gx.map((x,i)=>[x,gy[i]]).filter(p=>inR(p[0]));
  const poly=sh.length>1?`<polygon class="hl" points="${sx(sh[0][0])},${sy(0)} ${sh.map(p=>sx(p[0])+','+sy(p[1])).join(' ')} ${sx(sh[sh.length-1][0])},${sy(0)}"/>`:'';
  return poly+`<polyline class="curve" points="${gx.map((x,i)=>sx(x)+','+sy(gy[i])).join(' ')}"/>`;},'x','f(x)');}
function chartScatter(x,y,a,b){
 const x0=Math.min(...x),x1=Math.max(...x),y0=Math.min(...y,a+b*x0,a+b*x1),y1=Math.max(...y,a+b*x0,a+b*x1);
 const px=(x1-x0)*.08||1,py=(y1-y0)*.08||1;
 return plot([x0-px,x1+px],[y0-py,y1+py],(sx,sy)=>`<line class="ln" x1="${sx(x0-px)}" y1="${sy(a+b*(x0-px))}" x2="${sx(x1+px)}" y2="${sy(a+b*(x1+px))}"/>`+x.map((xi,i)=>`<circle class="pt" r="4" cx="${sx(xi)}" cy="${sy(y[i])}"/>`).join(''),'x','y');}

/* ===================== PROBLEMI ===================== */
const hyp=(alt,m0,sym='\\mu')=>[L`H_0:\ ${sym}=${F(m0)}`,alt==='two.sided'?L`H_1:\ ${sym}\ne ${F(m0)}`:alt==='greater'?L`H_1:\ ${sym}>${F(m0)}`:L`H_1:\ ${sym}<${F(m0)}`];
const ALT=[['two.sided','dvostrani (H₁: ≠)'],['greater','jednostrani (H₁: >)'],['less','jednostrani (H₁: <)']];
const decide=(p,al)=>p<al?L`p=${F(p)}<\alpha=${F(al)}\ \Rightarrow\ \textbf{odbacujemo }H_0`:L`p=${F(p)}\ge\alpha=${F(al)}\ \Rightarrow\ \textbf{ne odbacujemo }H_0`;
const critTex=(alt,name,df,al,crit)=>alt==='two.sided'?L`\text{kritična vrijednost: }|${name}|>${name==='t'?`t_{${df};\\,${F(al/2)}}`:`z_{${F(al/2)}}`}=${F(crit)}`:alt==='greater'?L`\text{kritična vrijednost: }${name}>${name==='t'?`t_{${df};\\,${F(al)}}`:`z_{${F(al)}}`}=${F(crit)}`:L`\text{kritična vrijednost: }${name}<-${name==='t'?`t_{${df};\\,${F(al)}}`:`z_{${F(al)}}`}=${F(crit)}`;
const gridQ=(typ)=>({eq:'P(X = a)',le:'P(X ≤ a)',lt:'P(X < a)',ge:'P(X ≥ a)',gt:'P(X > a)',between:'P(a ≤ X ≤ b)',quant:'kvantil: x tako da je P(X ≤ x) = p (a = p)'}[typ]);
const QOPT=['eq','le','lt','ge','gt','between','quant'].map(t=>[t,gridQ(t)]);

/* ---- distribucije ---- */
const pr=(id,lbl,def,o)=>({id,lbl,def,o});
const DIST={
binom:{lbl:'Binomna B(n, p)',disc:true,par:[pr('n','n (broj pokusa)',10,{int:true,min:1}),pr('p','p (vjerojatnost uspjeha)',0.5,{min:0,max:1})],
 def:P=>`n <- ${P.n}\np <- ${P.p}`,pmf:'dbinom(k, n, p)',cdf:'pbinom(floor(x), n, p)',lo:'0',hi:'n',ex:'n * p',vr:'n * p * (1 - p)',
 form:L`P(X=k)=\binom{n}{k}p^k(1-p)^{n-k},\ k=0,\dots,n;\qquad E(X)=np,\quad \mathrm{Var}(X)=np(1-p)`,
 sub:(P,k)=>L`\binom{${P.n}}{${k}}\cdot${F(P.p)}^{${k}}\cdot${F(1-P.p)}^{${P.n-k}}`,
 exT:P=>L`np=${P.n}\cdot${F(P.p)}`,vrT:P=>L`np(1-p)=${P.n}\cdot${F(P.p)}\cdot${F(1-P.p)}`},
pois:{lbl:'Poissonova P(λ)',disc:true,par:[pr('lambda','λ (>0)',3,{gt:0})],
 def:P=>`lambda <- ${P.lambda}`,pmf:'dpois(k, lambda)',cdf:'ppois(floor(x), lambda)',lo:'0',hi:'Inf',ex:'lambda',vr:'lambda',
 form:L`P(X=k)=e^{-\lambda}\frac{\lambda^k}{k!},\ k=0,1,2,\dots;\qquad E(X)=\mathrm{Var}(X)=\lambda`,
 sub:(P,k)=>L`e^{-${F(P.lambda)}}\frac{${F(P.lambda)}^{${k}}}{${k}!}`,exT:P=>L`\lambda=${F(P.lambda)}`,vrT:P=>L`\lambda=${F(P.lambda)}`},
geom:{lbl:'Geometrijska Geom(p)',disc:true,par:[pr('p','p (vjerojatnost uspjeha, 0<p≤1)',0.4,{gt:0,max:1})],
 def:P=>`p <- ${P.p}`,pmf:'dgeom(k - 1, p)',cdf:'pgeom(floor(x) - 1, p)',lo:'1',hi:'Inf',ex:'1 / p',vr:'(1 - p) / p^2',
 form:L`P(X=k)=(1-p)^{k-1}p,\ k=1,2,\dots;\qquad E(X)=\frac1p,\quad \mathrm{Var}(X)=\frac{1-p}{p^2}`,
 sub:(P,k)=>L`${F(1-P.p)}^{${k-1}}\cdot${F(P.p)}`,exT:P=>L`\frac1p=\frac1{${F(P.p)}}`,vrT:P=>L`\frac{1-p}{p^2}=\frac{${F(1-P.p)}}{${F(P.p*P.p)}}`},
hyper:{lbl:'Hipergeometrijska (p plavih, c crvenih, n izvlačenja)',disc:true,par:[pr('pl','p (broj plavih)',4,{int:true,min:0}),pr('cr','c (broj crvenih)',48,{int:true,min:0}),pr('n','n (broj izvlačenja)',5,{int:true,min:1})],
 def:P=>`pl <- ${P.pl}\ncr <- ${P.cr}\nn <- ${P.n}`,pmf:'dhyper(k, pl, cr, n)',cdf:'phyper(floor(x), pl, cr, n)',lo:'max(0, n - cr)',hi:'min(pl, n)',ex:'n * pl / (pl + cr)',vr:'n * pl * cr * (pl + cr - n) / ((pl + cr)^2 * (pl + cr - 1))',
 form:L`P(X=k)=\frac{\binom{p}{k}\binom{c}{n-k}}{\binom{p+c}{n}};\qquad E(X)=\frac{np}{p+c},\quad \mathrm{Var}(X)=\frac{npc(p+c-n)}{(p+c)^2(p+c-1)}`,
 sub:(P,k)=>L`\frac{\binom{${P.pl}}{${k}}\binom{${P.cr}}{${P.n-k}}}{\binom{${P.pl+P.cr}}{${P.n}}}`,exT:P=>L`\frac{np}{p+c}=\frac{${P.n}\cdot${P.pl}}{${P.pl+P.cr}}`,
 vrT:P=>L`\frac{npc(p+c-n)}{(p+c)^2(p+c-1)}=\frac{${P.n}\cdot${P.pl}\cdot${P.cr}\cdot${P.pl+P.cr-P.n}}{${P.pl+P.cr}^2\cdot${P.pl+P.cr-1}}`,
 check:P=>P.n>P.pl+P.cr?'n ne smije biti veći od p + c':(P.pl+P.cr<2?'p + c mora biti ≥ 2':'')},
unifd:{lbl:'Diskretna uniformna Unif{a, b}',disc:true,par:[pr('a','a (cijeli broj)',1,{int:true}),pr('b','b (cijeli broj, b>a)',6,{int:true})],
 def:P=>`a <- ${P.a}\nb <- ${P.b}`,pmf:'ifelse(k >= a & k <= b, 1 / (b - a + 1), 0)',cdf:'pmin(1, pmax(0, (floor(x) - a + 1) / (b - a + 1)))',lo:'a',hi:'b',ex:'(a + b) / 2',vr:'((b - a + 1)^2 - 1) / 12',
 form:L`P(X=k)=\frac{1}{b-a+1},\ k=a,\dots,b;\qquad E(X)=\frac{a+b}{2},\quad \mathrm{Var}(X)=\frac{(b-a+1)^2-1}{12}`,
 sub:(P,k)=>L`\frac{1}{b-a+1}=\frac{1}{${P.b-P.a+1}}`,exT:P=>L`\frac{a+b}{2}=\frac{${P.a}+${P.b}}{2}`,vrT:P=>L`\frac{(b-a+1)^2-1}{12}=\frac{${(P.b-P.a+1)**2}-1}{12}`,
 check:P=>P.b<=P.a?'b mora biti veći od a':''},
norm:{lbl:'Normalna N(μ, σ²)',disc:false,par:[pr('mu','μ (očekivanje)',2,{}),pr('s2','σ² (varijanca, >0)',4,{gt:0})],
 def:P=>`mu <- ${P.mu}\ns2 <- ${P.s2}\ns <- sqrt(s2)`,dn:'dnorm(x, mu, s)',cdf:'pnorm(x, mu, s)',qf:'qnorm(x, mu, s)',g0:'mu - 4 * s',g1:'mu + 4 * s',ex:'mu',vr:'s2',
 form:L`f(x)=\frac{1}{\sigma\sqrt{2\pi}}e^{-\frac{(x-\mu)^2}{2\sigma^2}},\quad Z=\frac{X-\mu}{\sigma}\sim N(0,1),\quad P(a<X<b)=\Phi\!\left(\tfrac{b-\mu}{\sigma}\right)-\Phi\!\left(\tfrac{a-\mu}{\sigma}\right)`,
 cdfTex:(P,x,Fv,z)=>L`F(${F(x)})=\Phi\!\left(\frac{${F(x)}-${FP(P.mu)}}{${F(Math.sqrt(P.s2))}}\right)=\Phi(${F(z)})=${F(Fv)}`,
 qTex:(P,p,qv,z)=>L`x_p=\mu+\sigma\,\Phi^{-1}(p)=${F(P.mu)}+${F(Math.sqrt(P.s2))}\cdot(${F(z)})=${F(qv)}`,
 exT:P=>L`\mu=${F(P.mu)}`,vrT:P=>L`\sigma^2=${F(P.s2)}`},
exp:{lbl:'Eksponencijalna Exp(λ)',disc:false,par:[pr('lambda','λ (>0)',0.25,{gt:0})],
 def:P=>`lambda <- ${P.lambda}`,dn:'dexp(x, lambda)',cdf:'pexp(x, lambda)',qf:'qexp(x, lambda)',g0:'0',g1:'-log(0.001) / lambda',ex:'1 / lambda',vr:'1 / lambda^2',
 form:L`f(x)=\lambda e^{-\lambda x}\ (x>0),\quad F(x)=1-e^{-\lambda x};\qquad E(X)=\frac1\lambda,\quad \mathrm{Var}(X)=\frac1{\lambda^2}`,
 cdfTex:(P,x,Fv)=>L`F(${F(x)})=1-e^{-${F(P.lambda)}\cdot ${F(x)}}=${F(Fv)}`,
 qTex:(P,p,qv)=>L`x_p=-\frac{\ln(1-p)}{\lambda}=-\frac{\ln(${F(1-p)})}{${F(P.lambda)}}=${F(qv)}`,
 exT:P=>L`\frac1\lambda=\frac{1}{${F(P.lambda)}}`,vrT:P=>L`\frac1{\lambda^2}=\frac{1}{${F(P.lambda**2)}}`},
unif:{lbl:'Neprekidna uniformna U(a, b)',disc:false,par:[pr('ua','a',-1,{}),pr('ub','b (b>a)',3,{})],
 def:P=>`ua <- ${P.ua}\nub <- ${P.ub}`,dn:'dunif(x, ua, ub)',cdf:'punif(x, ua, ub)',qf:'qunif(x, ua, ub)',g0:'ua - 0.25 * (ub - ua)',g1:'ub + 0.25 * (ub - ua)',ex:'(ua + ub) / 2',vr:'(ub - ua)^2 / 12',
 form:L`f(x)=\frac{1}{b-a}\ (a<x<b),\quad F(x)=\frac{x-a}{b-a};\qquad E(X)=\frac{a+b}{2},\quad \mathrm{Var}(X)=\frac{(b-a)^2}{12}`,
 cdfTex:(P,x,Fv)=>L`F(${F(x)})=\min\!\left(1,\max\!\left(0,\frac{${F(x)}-(${F(P.ua)})}{${F(P.ub)}-(${F(P.ua)})}\right)\right)=${F(Fv)}`,
 qTex:(P,p,qv)=>L`x_p=a+p(b-a)=${F(P.ua)}+${F(p)}\cdot${F(P.ub-P.ua)}=${F(qv)}`,
 exT:P=>L`\frac{a+b}{2}=\frac{${F(P.ua)}+${FP(P.ub)}}{2}`,vrT:P=>L`\frac{(b-a)^2}{12}=\frac{${F((P.ub-P.ua)**2)}}{12}`,
 check:P=>P.ub<=P.ua?'b mora biti veći od a':''},
pareto:{lbl:'Paretova Pareto(x_m, α)',disc:false,par:[pr('xm','x_m (skala, >0)',1,{gt:0}),pr('alpha','α (oblik, >0)',3,{gt:0})],

function distRun(g){
 const d=g.sel('dist'),cfg=DIST[d],typ=g.sel('typ'),P={};
 cfg.par.forEach(p=>P[p.id]=g.num(`${d}_${p.id}`,p.o));
 const ce=cfg.check&&cfg.check(P);if(ce)throw new Error(ce);
 let q1,q2=0;
 if(typ==='quant'){if(cfg.disc)throw new Error('Kvantil je podržan samo za neprekidne razdiobe.');q1=g.num('q1',{gt:0,max:1-1e-12});}
 else q1=g.num('q1',cfg.disc?{int:true}:{});
 if(typ==='between'){q2=g.num('q2',cfg.disc?{int:true}:{});if(q2<q1)g.bad('q2','b mora biti ≥ a');}
 let code,hidden;
 if(cfg.disc){
  code=`${cfg.def(P)}\nPmf <- function(k) ${cfg.pmf}   # P(X = k)\nFc <- function(x) ${cfg.cdf}   # P(X <= x)\nslo <- ${cfg.lo}; shi <- ${cfg.hi}   # nosilac razdiobe\ntyp <- "${typ}"; q1 <- ${q1}; q2 <- ${q2}
EX <- ${cfg.ex}; VX <- ${cfg.vr}
rng <- switch(typ, eq = c(q1, q1), le = c(slo, q1), lt = c(slo, q1 - 1), ge = c(slo, q1 - 1), gt = c(slo, q1), between = c(q1, q2))
ks <- if (rng[1] <= rng[2]) rng[1]:rng[2] else integer(0)
ks <- ks[ks >= slo & ks <= shi]
ps <- Pmf(ks)
q <- switch(typ, eq = Pmf(q1), le = Fc(q1), lt = Fc(q1 - 1), ge = 1 - Fc(q1 - 1), gt = 1 - Fc(q1), between = Fc(q2) - Fc(q1 - 1))
if (length(ks) <= 20) print(data.frame(k = ks, P = round(ps, 6)))
cat("Tražena vjerojatnost =", q, "\\n")
cat("E(X) =", EX, "  Var(X) =", VX, "\\n")`;
  hidden=`kk <- max(slo, floor(EX - 4 * sqrt(VX) - 2)):min(shi, ceiling(EX + 4 * sqrt(VX) + 2)); kk <- head(kk, 100)
H("q", q); H("EX", EX); H("VX", VX); H("slo", slo); H("shi", shi); H("ks", ks); H("ps", ps); H("gx", kk); H("gy", Pmf(kk))`;
 }else{
  code=`${cfg.def(P)}\nFc <- function(x) ${cfg.cdf}   # funkcija distribucije\nDn <- function(x) ${cfg.dn}   # funkcija gustoće\nQf <- function(x) ${cfg.qf}   # kvantilna funkcija
typ <- "${typ}"; q1 <- ${q1}; q2 <- ${q2}
EX <- ${cfg.ex}; VX <- ${cfg.vr}
q <- switch(typ, eq = 0, le = Fc(q1), lt = Fc(q1), ge = 1 - Fc(q1), gt = 1 - Fc(q1), between = Fc(q2) - Fc(q1), quant = Qf(q1))
cat("Tražena vrijednost =", q, "\\n")
cat("E(X) =", EX, "  Var(X) =", VX, "\\n")`;
  hidden=`Fa <- if (typ == "quant") NA else Fc(q1); Fb <- if (typ == "between") Fc(q2) else NA
${d==='norm'?'za <- (q1 - mu) / s; zb <- (q2 - mu) / s; zq <- if (typ == "quant") qnorm(q1) else NA':'za <- NA; zb <- NA; zq <- NA'}
gx <- seq(${cfg.g0}, ${cfg.g1}, length.out = 200)
H("q", q); H("EX", EX); H("VX", VX); H("Fa", Fa); H("Fb", Fb); H("za", za); H("zb", zb); H("zq", zq); H("gx", gx); H("gy", Dn(gx))`;
 }
 const tex=v=>{
  const q=v.x('q'),EX=v.x('EX'),VX=v.x('VX'),st=[],an=[L`Razdioba: \(\text{${tx(cfg.lbl)}}\). Traži se: \(\text{${tx(gridQ(typ))}}\) uz \(a=${F(q1)}${typ==='between'?`,\\ b=${F(q2)}`:''}\).`,
   'Parametri: '+cfg.par.map(p=>`\\(${tx(p.id)}=${F(P[p.id])}\\)`).join(', ')];
  if(cfg.disc){
   const ks=v.a('ks'),ps=v.a('ps'),slo=v.x('slo'),shi=v.x('shi'),tm=ps.map(z=>F(z,5)),s=sum(ps);
   if(typ==='eq'){
    if(q1<slo||q1>shi)st.push(L`k=${q1}\text{ nije u skupu vrijednosti }\{${F(slo)},\dots,${F(shi)}\}\Rightarrow P(X=${q1})=0`);
    else st.push(L`P(X=${q1})=${cfg.sub(P,q1)}=${F(q)}`);}
   else{
    const lw=typ==='le'?`P(X\\le ${q1})`:typ==='lt'?`P(X\\le ${q1-1})`:typ==='ge'?`P(X\\le ${q1-1})`:typ==='gt'?`P(X\\le ${q1})`:`P(${q1}\\le X\\le ${q2})`;
    const rest=typ==='ge'||typ==='gt';
    if(rest)st.push(L`P(X${typ==='ge'?`\\ge ${q1}`:`>${q1}`})=1-${lw}`);
    st.push(ks.length?L`${lw}=\sum_{k=${ks[0]}}^{${ks[ks.length-1]}}P(X=k)=${lst(tm,8)}=${F(s)}`:L`${lw}=0\ \text{(prazan skup vrijednosti)}`);
    if(rest)st.push(L`P(X${typ==='ge'?`\\ge ${q1}`:`>${q1}`})=1-${F(s)}=${F(q)}`);
    if(ks.length&&ks.length<=6)st.push(...ks.map((k,i)=>L`P(X=${k})=${cfg.sub(P,k)}=${F(ps[i],6)}`));}
  }else{
   const Fa=v.x('Fa'),Fb=v.x('Fb'),za=v.x('za'),zb=v.x('zb'),zq=v.x('zq');
   if(typ==='eq')st.push(L`P(X=${F(q1)})=\int_{${F(q1)}}^{${F(q1)}}f(x)\,dx=0`);
   else if(typ==='quant')st.push(cfg.qTex(P,q1,q,zq));
   else if(typ==='le'||typ==='lt')st.push(cfg.cdfTex(P,q1,Fa,za),L`P(X${typ==='le'?'\\le':'<'}${F(q1)})=F(${F(q1)})=${F(q)}`);
   else if(typ==='ge'||typ==='gt')st.push(cfg.cdfTex(P,q1,Fa,za),L`P(X${typ==='ge'?'\\ge':'>'}${F(q1)})=1-F(${F(q1)})=1-${F(Fa)}=${F(q)}`);
   else st.push(cfg.cdfTex(P,q1,Fa,za),cfg.cdfTex(P,q2,Fb,zb),L`P(${F(q1)}\le X\le ${F(q2)})=F(${F(q2)})-F(${F(q1)})=${F(Fb)}-${F(Fa)}=${F(q)}`);
  }
  st.push(L`E(X)=${cfg.exT(P)}=${F(EX)},\qquad \mathrm{Var}(X)=${cfg.vrT(P)}=${F(VX)}`);
  const R={eq:`P(X=${F(q1)})`,le:`P(X\\le ${F(q1)})`,lt:`P(X<${F(q1)})`,ge:`P(X\\ge ${F(q1)})`,gt:`P(X>${F(q1)})`,between:`P(${F(q1)}\\le X\\le ${F(q2)})`,quant:'x_p'};
  return{analiza:an,formula:[cfg.form],steps:st,result:L`${R[typ]}=${F(q)}`};};
 return{code,hidden,tex,chart:v=>chartDist(v,cfg.disc,typ,q1,q2)};
}

{id:'bayes',lbl:'1.3 Uvjetna vjerojatnost i Bayesova formula',probs:[
 {id:'cond',lbl:'Uvjetna vjerojatnost P(A | C)',fields:[N('pac','P(A ∩ C)',0.2),N('pc','P(C)',0.5),N('pa','P(A) (neobavezno — provjera nezavisnosti)','', '',undefined,'Uvjetna vjerojatnost P(A|C) = P(A ∩ C) / P(C) mjeri vjerojatnost događaja A ako znamo da se C sigurno dogodio.')],
  run(g){const pc=g.num('pc',{gt:0,max:1}),pac=g.num('pac',{min:0,max:pc}),pa=g.numOpt('pa',{min:0,max:1});
   if(pa!==null&&pac>pa+1e-12)g.bad('pac','P(A∩C) ne može biti veći od P(A)');
   return{code:`pac <- ${pac}; pc <- ${pc}\npagc <- pac / pc\ncat("P(A | C) =", pagc, "\\n")${pa!==null?`\npa <- ${pa}\ncat("P(A) * P(C) =", pa * pc, " ; P(A ∩ C) =", pac, "\\n")\ncat("Nezavisni:", isTRUE(all.equal(pa * pc, pac)), "\\n")${pa>0?'\ncat("P(C | A) =", pac / pa, "\\n")':''}`:''}`,hidden:`H("r", pagc)`,
   tex(v){const r=v.x('r'),st=[L`P(A\mid C)=\frac{${F(pac)}}{${F(pc)}}=${F(r)}`];
    if(pa!==null){st.push(L`P(A)P(C)=${F(pa)}\cdot${F(pc)}=${F(pa*pc)}\ ${Math.abs(pa*pc-pac)<1e-9?'=':'\\ne'}\ P(A\cap C)=${F(pac)}\Rightarrow\ \text{${Math.abs(pa*pc-pac)<1e-9?'A i C su nezavisni':'A i C nisu nezavisni'}}`);if(pa>0)st.push(L`P(C\mid A)=\frac{${F(pac)}}{${F(pa)}}=${F(pac/pa)}`);}
    return{analiza:[L`Zadano: \(P(A\cap C)=${F(pac)}\), \(P(C)=${F(pc)}\)${pa!==null?L`, \(P(A)=${F(pa)}\)`:''}.`],formula:[L`P(A\mid C)=\frac{P(A\cap C)}{P(C)},\quad P(C)>0`],steps:st,result:L`P(A\mid C)=${F(r)}`};}};}},
 {id:'tp',lbl:'Formula potpune vjerojatnosti i Bayesov teorem',fields:[T('prior','Vjerojatnosti hipoteza P(Hᵢ) (zbroj = 1)','0.2, 0.8','potpun sustav događaja',undefined,'Formula potpune vjerojatnosti računa ukupnu vjerojatnost P(A) preko potpunog sustava hipoteza H_i. Bayesov teorem računa aposteriorne vjerojatnosti P(H_i|A).'),T('lik','Uvjetne vjerojatnosti P(A | Hᵢ)','0.3, 0.1')],
  run(g){const pr=g.vec('prior',{min:2}),li=g.vec('lik',{min:2});if(pr.length!==li.length)g.bad('lik','mora imati isti broj vrijednosti kao P(Hᵢ)');
   if([...pr,...li].some(z=>z<0||z>1))g.bad('prior','sve vjerojatnosti moraju biti u [0,1]');if(Math.abs(sum(pr)-1)>1e-9)g.bad('prior',`zbroj je ${+sum(pr).toFixed(9)}, a mora biti 1`);
   if(sum(pr.map((p,i)=>p*li[i]))===0)g.bad('lik','P(A)=0, Bayesova formula nije definirana');
   return{code:`prior <- ${rv(pr)}\nlik <- ${rv(li)}\njoint <- prior * lik          # P(Hi) P(A|Hi)\nPA <- sum(joint)             # formula potpune vjerojatnosti\npost <- joint / PA           # Bayesova formula\nprint(data.frame(H = paste0("H", seq_along(prior)), prior, lik, joint = round(joint, 6), post = round(post, 6)))\ncat("P(A) =", PA, "\\n")`,
   hidden:`H("PA", PA); H("post", post)`,
   tex(v){const PA=v.x('PA'),po=v.a('post');return{analiza:[L`Potpun sustav događaja \(H_1,\dots,H_${pr.length}\) s \(P(H_i)=${pr.map(F).join(',\\ ')}\); \(P(A\mid H_i)=${li.map(F).join(',\\ ')}\).`],
   formula:[L`P(A)=\sum_{i}P(H_i)P(A\mid H_i),\qquad P(H_i\mid A)=\frac{P(H_i)\,P(A\mid H_i)}{P(A)}`],
   steps:[L`P(A)=${pr.map((p,i)=>L`${F(p)}\cdot${F(li[i])}`).join(' + ')}=${F(PA)}`,...pr.map((p,i)=>L`P(H_{${i+1}}\mid A)=\frac{${F(p)}\cdot${F(li[i])}}{${F(PA)}}=${F(po[i])}`)],
   result:L`P(A)=${F(PA)},\quad ${po.map((z,i)=>L`P(H_{${i+1}}\mid A)=${F(z)}`).join(',\\ ')}`};}};}},
 {id:'diag',lbl:'Dijagnostički test (rijetka bolest)',fields:[N('prev','Prevalencija P(D)',0.01),N('sens','Osjetljivost P(T⁺ | D)',0.95),N('spec','Specifičnost P(T⁻ | Dᶜ)',0.95,undefined,undefined,'Osjetljivost = vjerojatnost da je test pozitivan ako je osoba bolesna. Specifičnost = vjerojatnost da je test negativan ako je osoba zdrava.')],
  run(g){const pv=g.num('prev',{min:0,max:1}),se=g.num('sens',{min:0,max:1}),sp=g.num('spec',{min:0,max:1});
   const PT0=se*pv+(1-sp)*(1-pv);if(PT0<=0||PT0>=1)g.bad('prev','P(T⁺) mora biti u (0,1) za izračun prediktivnih vrijednosti');
   return{code:`prev <- ${pv}; sens <- ${se}; spec <- ${sp}\nPT <- sens * prev + (1 - spec) * (1 - prev)      # P(T+)\nppv <- sens * prev / PT                           # P(D | T+)\nnpv <- spec * (1 - prev) / (1 - PT)               # P(Dc | T-)\ncat("P(T+) =", PT, "\\n")\ncat("P(D | T+) =", ppv, "\\n")\ncat("P(Dc | T-) =", npv, "\\n")`,hidden:`H("PT", PT); H("ppv", ppv); H("npv", npv)`,
   tex(v){const PT=v.x('PT'),pp=v.x('ppv'),np=v.x('npv');return{analiza:[L`\(P(D)=${F(pv)}\), osjetljivost \(P(T^+\mid D)=${F(se)}\), specifičnost \(P(T^-\mid D^c)=${F(sp)}\).`],
   formula:[L`P(T^+)=P(T^+\mid D)P(D)+P(T^+\mid D^c)P(D^c),\qquad P(D\mid T^+)=\frac{P(T^+\mid D)P(D)}{P(T^+)}`],
   steps:[L`P(T^+)=${F(se)}\cdot${F(pv)}+${F(1-sp)}\cdot${F(1-pv)}=${F(PT)}`,L`P(D\mid T^+)=\frac{${F(se)}\cdot${F(pv)}}{${F(PT)}}=${F(pp)}`,L`P(D^c\mid T^-)=\frac{${F(sp)}\cdot${F(1-pv)}}{${F(1-PT)}}=${F(np)}`],result:L`P(D\mid T^+)=${F(pp)}\ (${F(pp*100,4)}\%)`};}};}}]},

{id:'ocek',lbl:'1.5 Očekivanje, varijanca i CGT',probs:[
 {id:'exvar',lbl:'Očekivanje i varijanca diskretne slučajne varijable',fields:[T('x','Vrijednosti aᵢ','-1, 0, 1, 2'),T('p','Vjerojatnosti pᵢ (zbroj = 1)','0.25, 0.125, 0.5, 0.125',undefined,undefined,'E(X) je očekivana vrijednost (teorijski prosjek). Var(X) = E(X^2) - (E(X))^2. Svojstva: E(aX+b) = aE(X)+b, Var(aX+b) = a²Var(X).'),N('a','a (za Y = aX + b)',2),N('b','b',-3)],
  run(g){const x=g.vec('x',{min:1}),p=g.vec('p',{min:1}),a=g.num('a'),b=g.num('b');if(x.length!==p.length)g.bad('p','mora imati isti broj vrijednosti kao x');if(p.some(z=>z<0||z>1))g.bad('p','vjerojatnosti moraju biti u [0,1]');if(Math.abs(sum(p)-1)>1e-9)g.bad('p',`zbroj je ${+sum(p).toFixed(9)}, a mora biti 1`);
   return{code:`x <- ${rv(x)}\np <- ${rv(p)}\na <- ${a}; b <- ${b}\nEX <- sum(x * p)\nEX2 <- sum(x^2 * p)\nVX <- EX2 - EX^2\ncat("E(X) =", EX, "\\n"); cat("E(X^2) =", EX2, "\\n")\ncat("Var(X) =", VX, " SD(X) =", sqrt(VX), "\\n")\ncat("E(aX+b) =", a * EX + b, "  Var(aX+b) =", a^2 * VX, "\\n")`,hidden:`H("EX", EX); H("EX2", EX2); H("VX", VX)`,
   tex(v){const EX=v.x('EX'),E2=v.x('EX2'),VX=v.x('VX');return{analiza:[L`Diskretna slučajna varijabla s \(${x.length}\) vrijednosti; \(Y=${F(a)}X+(${F(b)})\).`],
   formula:[L`E(X)=\sum a_ip_i,\quad \mathrm{Var}(X)=E(X^2)-(EX)^2,\quad E(aX+b)=aEX+b,\quad \mathrm{Var}(aX+b)=a^2\mathrm{Var}(X)`],
   steps:[L`E(X)=${lst(x.map((z,i)=>L`${FP(z)}\cdot${F(p[i])}`),6)}=${F(EX)}`,L`E(X^2)=${lst(x.map((z,i)=>L`${FP(z)}^2\cdot${F(p[i])}`),6)}=${F(E2)}`,L`\mathrm{Var}(X)=${F(E2)}-${FP(EX)}^2=${F(VX)},\quad \sigma=\sqrt{${F(VX)}}=${F(Math.sqrt(VX))}`,L`E(Y)=${FP(a)}\cdot${FP(EX)}+(${F(b)})=${F(a*EX+b)},\quad \mathrm{Var}(Y)=${FP(a)}^2\cdot${F(VX)}=${F(a*a*VX)}`],result:L`E(X)=${F(EX)},\quad \mathrm{Var}(X)=${F(VX)}`};}};}},
 {id:'joint',lbl:'Zajednička razdioba: kovarijanca i korelacija',fields:[T('x','Vrijednosti X (stupci)','0, 1, 2'),T('y','Vrijednosti Y (retci)','-1, 1'),A('m','Tablica P(X = xⱼ, Y = yᵢ): jedan redak po Y, retci u novom redu ili ;','1/6 1/6 1/6\n0 1/2 0','razlomci poput 1/6 su dozvoljeni',undefined,'Kovarijanca Cov(X,Y) = E(XY) - E(X)E(Y) mjeri smjer linearne povezanosti. Ako su X i Y nezavisne, Cov(X,Y) = 0.')],
  run(g){const x=g.vec('x',{min:1}),y=g.vec('y',{min:1});const rows=g.raw('m').split(/\n|;/).map(r=>r.trim()).filter(Boolean).map(r=>r.split(/[\s,]+/).filter(Boolean).map(t=>{const [a,b]=t.split('/');const v=b!==undefined?Number(a)/Number(b):Number(a);if(!isFinite(v))g.bad('m',`„${t}“ nije broj`);return v;}));
   if(rows.length!==y.length||rows.some(r=>r.length!==x.length))g.bad('m',`tablica mora imati ${y.length} redaka i ${x.length} stupaca`);const all=rows.flat();if(all.some(z=>z<0))g.bad('m','vjerojatnosti ne smiju biti negativne');if(Math.abs(sum(all)-1)>1e-9)g.bad('m',`zbroj je ${+sum(all).toFixed(9)}, a mora biti 1`);
   return{code:`x <- ${rv(x)}\ny <- ${rv(y)}\nM <- matrix(${rv(all)}, nrow = ${y.length}, ncol = ${x.length}, byrow = TRUE)\npx <- colSums(M); py <- rowSums(M)    # marginalne razdiobe\nEX <- sum(x * px); EY <- sum(y * py)\nEXY <- sum(outer(y, x) * M)\ncov <- EXY - EX * EY\nVX <- sum(x^2 * px) - EX^2; VY <- sum(y^2 * py) - EY^2\ncor <- if (VX > 0 && VY > 0) cov / sqrt(VX * VY) else NA\nnez <- all(abs(M - outer(py, px)) < 1e-9)\ncat("P(X):", px, "\\nP(Y):", py, "\\n")\ncat("E(X) =", EX, " E(Y) =", EY, " E(XY) =", EXY, "\\n")\ncat("Cov(X,Y) =", cov, " Corr(X,Y) =", cor, "\\n")\ncat("X i Y nezavisne:", nez, "\\n")`,
   hidden:`H("px", px); H("py", py); H("EX", EX); H("EY", EY); H("EXY", EXY); H("cov", cov); H("VX", VX); H("VY", VY); H("cor", cor); H("nez", nez)`,
   tex(v){const px=v.a('px'),py=v.a('py'),EX=v.x('EX'),EY=v.x('EY'),EXY=v.x('EXY'),cv=v.x('cov'),r=v.x('cor');return{analiza:[L`Zajednička razdioba \(P(X=x_j,Y=y_i)\); marginale: \(P(X)=${px.map(z=>F(z,4)).join(',\\ ')}\), \(P(Y)=${py.map(z=>F(z,4)).join(',\\ ')}\).`],
   formula:[L`\mathrm{Cov}(X,Y)=E(XY)-E(X)E(Y),\qquad \mathrm{Corr}(X,Y)=\frac{\mathrm{Cov}(X,Y)}{\sqrt{\mathrm{Var}(X)\mathrm{Var}(Y)}}`],
   steps:[L`E(X)=${F(EX)},\quad E(Y)=${F(EY)}`,L`E(XY)=\sum_{i,j}x_jy_iP(X=x_j,Y=y_i)=${F(EXY)}`,L`\mathrm{Cov}(X,Y)=${F(EXY)}-${FP(EX)}\cdot${FP(EY)}=${F(cv)}`,L`\mathrm{Var}(X)=${F(v.x('VX'))},\ \mathrm{Var}(Y)=${F(v.x('VY'))}\Rightarrow\mathrm{Corr}(X,Y)=${Number.isNaN(r)?'\\text{nije definirana}':F(r)}`,
   L`\text{${v.s('nez')[0]==='TRUE'?'Zajednička razdioba = umnožak marginala ⇒ X i Y su nezavisne.':'Zajednička razdioba ≠ umnožak marginala ⇒ X i Y su zavisne'+(Math.abs(cv)<1e-12?' (iako su nekorelirane).':'.')}}`],result:L`\mathrm{Cov}=${F(cv)},\quad \mathrm{Corr}=${Number.isNaN(r)?'\\text{NA}':F(r)}`};}};}},
 {id:'cgt',lbl:'Centralni granični teorem (prosjek / zbroj)',fields:[S('kind','Veličina',[['mean','prosjek X̄ₙ'],['sum','zbroj Sₙ = X₁+…+Xₙ']],'sum',undefined,'Za velika n (n ≥ 30), zbroj S_n i prosjek X̄_n težak normalnoj razdiobi bez obzira na razdiobu pojedinih elemenata X_i.'),N('mu','μ (očekivanje jedne varijable)',312),N('s2','σ² (varijanca jedne varijable)',550),N('n','n (broj varijabli)',16000),S('typ','Vjerojatnost',[['gt','P(> a)'],['le','P(≤ a)'],['between','P(a ≤ . ≤ b)']],'gt'),N('a','a',5000000),N('b','b',5100000,'',v=>v.typ==='between')],
  run(g){const k=g.sel('kind'),mu=g.num('mu'),s2=g.num('s2',{gt:0}),n=g.num('n',{int:true,min:1}),typ=g.sel('typ'),a=g.num('a'),b=typ==='between'?g.num('b'):0;if(typ==='between'&&b<a)g.bad('b','b mora biti ≥ a');
   const sm=k==='mean';
   return{code:`mu <- ${mu}; s2 <- ${s2}; n <- ${n}\nm <- ${sm?'mu':'n * mu'}                 # očekivanje ${sm?'prosjeka':'zbroja'}\nsdv <- ${sm?'sqrt(s2 / n)':'sqrt(n * s2)'}     # standardna devijacija ${sm?'prosjeka':'zbroja'}\na <- ${a}; b <- ${b}\nza <- (a - m) / sdv; zb <- (b - m) / sdv\nq <- switch("${typ}", gt = 1 - pnorm(za), le = pnorm(za), between = pnorm(zb) - pnorm(za))\ncat("m =", m, " sd =", sdv, "\\n")\ncat("z_a =", za, " z_b =", zb, "\\n")\ncat("Tražena vjerojatnost ≈", q, "\\n")`,hidden:`H("m", m); H("sd", sdv); H("za", za); H("zb", zb); H("q", q)`,
   tex(v){const m=v.x('m'),sd=v.x('sd'),za=v.x('za'),zb=v.x('zb'),q=v.x('q'),nm=sm?'\\bar X_n':'S_n';return{analiza:[L`\(X_i\) nezavisne, jednako distribuirane, \(\mu=${F(mu)}\), \(\sigma^2=${F(s2)}\), \(n=${F(n)}\).`],
   formula:[L`Z_n=\frac{\bar X_n-\mu}{\sigma/\sqrt n}\ \xrightarrow{d}\ N(0,1);\qquad \bar X_n\approx N\!\left(\mu,\tfrac{\sigma^2}{n}\right),\quad S_n\approx N(n\mu,\,n\sigma^2)`],
   steps:[sm?L`E(\bar X_n)=\mu=${F(m)},\quad SD(\bar X_n)=\sqrt{\tfrac{${F(s2)}}{${F(n)}}}=${F(sd)}`:L`E(S_n)=n\mu=${F(n)}\cdot${FP(mu)}=${F(m)},\quad SD(S_n)=\sqrt{n\sigma^2}=\sqrt{${F(n)}\cdot${F(s2)}}=${F(sd)}`,
    L`z_a=\frac{${F(a)}-${FP(m)}}{${F(sd)}}=${F(za)}${typ==='between'?L`,\quad z_b=\frac{${F(b)}-${FP(m)}}{${F(sd)}}=${F(zb)}`:''}`,
    typ==='gt'?L`P(${nm}>${F(a)})\approx1-\Phi(${F(za)})=${F(q)}`:typ==='le'?L`P(${nm}\le${F(a)})\approx\Phi(${F(za)})=${F(q)}`:L`P(${F(a)}\le ${nm}\le ${F(b)})\approx\Phi(${F(zb)})-\Phi(${F(za)})=${F(q)}`],result:L`P\approx${F(q)}`};}};}},
 {id:'cgtb',lbl:'Moivre–Laplaceov CGT: normalna aproksimacija binomne',fields:[N('n','n',1000),N('p','p',0.5),N('k1','k₁ (donja granica)',490),N('k2','k₂ (gornja granica)',1000,undefined,undefined,'Aproksimacija binomne B(n,p) normalnom N(np, np(1-p)). Korekcija po neprekidnosti koristi granice k1 - 0.5 i k2 + 0.5.')],
  run(g){const n=g.num('n',{int:true,min:1}),p=g.num('p',{gt:0,max:0.999999}),k1=g.num('k1',{int:true,min:0,max:n}),k2=g.num('k2',{int:true,min:k1,max:n});
   return{code:`n <- ${n}; p <- ${p}; k1 <- ${k1}; k2 <- ${k2}\nm <- n * p; sdv <- sqrt(n * p * (1 - p))\ntocno <- pbinom(k2, n, p) - pbinom(k1 - 1, n, p)\nz1 <- (k1 - 0.5 - m) / sdv; z2 <- (k2 + 0.5 - m) / sdv\nkor <- pnorm(z2) - pnorm(z1)                                    # s korekcijom po neprekidnosti\nbez <- pnorm((k2 - m) / sdv) - pnorm((k1 - m) / sdv)            # bez korekcije\ncat("m =", m, " sd =", sdv, "\\n")\ncat("Točno (binomna) =", tocno, "\\n")\ncat("Aproksimacija s korekcijom =", kor, "\\n")\ncat("Aproksimacija bez korekcije =", bez, "\\n")`,
   hidden:`H("m", m); H("sd", sdv); H("tocno", tocno); H("kor", kor); H("bez", bez); H("z1", z1); H("z2", z2)`,
   tex(v){const m=v.x('m'),sd=v.x('sd');return{analiza:[L`\(X\sim B(${n},${F(p)})\); traži se \(P(${k1}\le X\le ${k2})\).`],formula:[L`E(X)=np,\ \mathrm{Var}(X)=np(1-p);\quad P(k_1\le X\le k_2)\approx\Phi\!\left(\frac{k_2+\frac12-np}{\sqrt{np(1-p)}}\right)-\Phi\!\left(\frac{k_1-\frac12-np}{\sqrt{np(1-p)}}\right)`],
   steps:[L`np=${F(m)},\quad \sqrt{np(1-p)}=${F(sd)}`,L`P\approx\Phi\!\left(\frac{${k2}+0.5-${F(m)}}{${F(sd)}}\right)-\Phi\!\left(\frac{${k1}-0.5-${F(m)}}{${F(sd)}}\right)=\Phi(${F(v.x('z2'))})-\Phi(${F(v.x('z1'))})=${F(v.x('kor'))}`,L`\text{Bez korekcije: }${F(v.x('bez'))};\quad \text{točna binomna vjerojatnost: }${F(v.x('tocno'))}`],result:L`P\approx${F(v.x('kor'))}\quad(\text{točno }${F(v.x('tocno'))})`};}};}},
 {id:'ineq',lbl:'Čebiševljeva i Markovljeva nejednakost',fields:[N('mu','μ = E(X)',40),N('s2','σ² = Var(X)',20),N('a','a (>0)',10,undefined,undefined,'Čebišev daje gornju granicu vjerojatnosti odstupanja |X - μ| ≥ a. Markov vrijedi ISKLJUČIVO za nenegativne varijable (X ≥ 0).')],
  run(g){const mu=g.num('mu'),s2=g.num('s2',{gt:0}),a=g.num('a',{gt:0});
   return{code:`mu <- ${mu}; s2 <- ${s2}; a <- ${a}\ncheb <- min(1, s2 / a^2)         # P(|X - mu| >= a) <= s2 / a^2\ncat("Čebišev: P(|X - mu| >= a) <=", cheb, "\\n")\n${mu>=0?'mark <- min(1, mu / a)            # za X >= 0: P(X >= a) <= mu / a\ncat("Markov (X >= 0): P(X >= a) <=", mark, "\\n")\n':''}cat("Za usporedbu, ako je X normalna: P(|X - mu| >= a) =", 2 * (1 - pnorm(a / sqrt(s2))), "\\n")`,hidden:`H("cheb", cheb); H("norm", 2 * (1 - pnorm(a / sqrt(s2))))${mu>=0?'; H("mark", mark)':''}`,
   tex(v){const st=[L`P(|X-\mu|\ge ${F(a)})\le\frac{${F(s2)}}{${F(a)}^2}=${F(v.x('cheb'))}`];if(mu>=0)st.push(L`P(X\ge ${F(a)})\le\frac{${F(mu)}}{${F(a)}}=${F(v.x('mark'))}\ \text{(samo za }X\ge0)`);st.push(L`\text{Ako je }X\text{ normalna: }P(|X-\mu|\ge a)=2\,(1-\Phi(${F(a/Math.sqrt(s2))}))=${F(v.x('norm'))}`);
   return{analiza:[L`\(E(X)=${F(mu)}\), \(\mathrm{Var}(X)=${F(s2)}\), \(a=${F(a)}\).`],formula:[L`\text{Čebišev: }P(|X-EX|\ge a)\le\frac{\mathrm{Var}(X)}{a^2},\qquad \text{Markov: }P(X\ge a)\le\frac{EX}{a}\ (X\ge0)`],steps:st,result:L`P(|X-\mu|\ge ${F(a)})\le${F(v.x('cheb'))}`};}};}}]},

{id:'zakl',lbl:'1.6 Statističko zaključivanje i regresija',probs:[
 {id:'ttest',lbl:'t-test o očekivanju (σ nepoznata)',fields:[S('mode','Ulaz',[['podaci','sirovi podaci'],['sazetak','sažetak (n, x̄, s)']],'podaci'),vecIn('podaci',undefined,'1.108, 1.009, 1.042, 1.053, 0.969, 1.002, 0.9688, 1.019, 1.062, 1.032, 1.072, 0.977, 1.062, 1.044, 1.069, 1.029, 0.979, 1.096, 1.079, 0.999',undefined,v=>v.mode==='podaci'),N('n','n',20,'',v=>v.mode==='sazetak'),N('xb','x̄',1.03354,'',v=>v.mode==='sazetak'),N('s','s',0.04229,'',v=>v.mode==='sazetak'),N('mu0','μ₀ (nul-hipoteza)',1),S('alt','Alternativa',ALT,'two.sided'),N('alpha','Razina značajnosti α',0.05,undefined,undefined,'Testiranje hipoteze H_0: μ = μ_0 kada populacijska varijanca σ nije poznata. Koristi t-razdiobu s n - 1 stupnjeva slobode.')],
  run(g){const dat=g.sel('mode')==='podaci',mu0=g.num('mu0'),alt=g.sel('alt'),al=g.num('alpha',{gt:0,max:0.5});let pre,n,xb,s;
   if(dat){const X=g.vec('podaci',{min:2});n=X.length;xb=sum(X)/n;s=Math.sqrt(sum(X.map(z=>(z-xb)**2))/(n-1));if(!(s>0))g.bad('podaci','svi su podaci jednaki (s = 0)');pre=`x <- ${rv(X)}\nn <- length(x); xbar <- mean(x); s <- sd(x)\nmu0 <- ${mu0}; alpha <- ${al}; alt <- "${alt}"\nprint(t.test(x, mu = mu0, alternative = alt, conf.level = 1 - alpha))`;}
   else{n=g.num('n',{int:true,min:2});xb=g.num('xb');s=g.num('s',{gt:0});pre=`n <- ${n}; xbar <- ${xb}; s <- ${s}\nmu0 <- ${mu0}; alpha <- ${al}; alt <- "${alt}"`;}
   return{code:`${pre}\ntst <- sqrt(n) * (xbar - mu0) / s ; df <- n - 1\np <- switch(alt, two.sided = 2 * pt(-abs(tst), df), greater = pt(tst, df, lower.tail = FALSE), less = pt(tst, df))\ncrit <- switch(alt, two.sided = qt(1 - alpha / 2, df), greater = qt(1 - alpha, df), less = -qt(1 - alpha, df))\nme <- qt(1 - alpha / 2, df) * s / sqrt(n)\ncat("t =", tst, " df =", df, " p-vrijednost =", p, " kritična vrijednost =", crit, "\\n")\ncat("Dvostrani interval pouzdanosti:", xbar - me, xbar + me, "\\n")`,
   hidden:`H("n", n); H("xb", xbar); H("s", s); H("t", tst); H("df", df); H("p", p); H("crit", crit); H("lo", xbar - me); H("hi", xbar + me)`,
   tex(v){const t=v.x('t'),df=v.x('df'),p=v.x('p'),h=hyp(alt,mu0);return{analiza:[L`Jedan uzorak, \(\sigma\) nepoznata ⇒ t-test. \(n=${n},\ \bar x=${F(xb)},\ s=${F(s)},\ \mu_0=${F(mu0)},\ \alpha=${F(al)}\).`,L`Hipoteze: \(${h[0]},\ ${h[1]}\)`],
   formula:[L`T=\frac{\sqrt n\,(\bar X_n-\mu_0)}{S_n}\sim t(n-1)\ \text{ako vrijedi }H_0`],
   steps:[L`t=\frac{\sqrt{${n}}\,(${F(xb)}-${FP(mu0)})}{${F(s)}}=${F(t)},\qquad df=n-1=${df}`,critTex(alt,'t',df,al,v.x('crit')),decide(p,al),L`\text{${F((1-al)*100)}\% interval pouzdanosti za }\mu:\ \bar x\pm t_{${df};\,${F(al/2)}}\frac{s}{\sqrt n}=[${F(v.x('lo'))},\ ${F(v.x('hi'))}]`],
   result:L`t=${F(t)},\quad p=${F(p)}\ \Rightarrow\ ${p<al?'\\text{odbacujemo }H_0':'\\text{ne odbacujemo }H_0'}`};}};}},
 {id:'ztest',lbl:'Z-test o očekivanju (σ poznata)',fields:[S('mode','Ulaz',[['podaci','sirovi podaci'],['sazetak','sažetak (n, x̄)']],'sazetak'),vecIn('podaci',undefined,'7.6, 7.5, 7.8, 7.9, 7.4, 7.85, 7.65, 7.7, 7.9, 7.7',undefined,v=>v.mode==='podaci'),N('n','n',5,'',v=>v.mode==='sazetak'),N('xb','x̄',9.5,'',v=>v.mode==='sazetak'),N('sig','σ (st. devijacija populacije)',2),N('mu0','μ₀',8),S('alt','Alternativa',ALT,'two.sided'),N('alpha','Razina značajnosti α',0.05,undefined,undefined,'Testiranje hipoteze H_0: μ = μ_0 kada je populacijska standardna devijacija σ POZNATA. Koristi standardnu normalnu N(0,1) razdiobu.')],
  run(g){const dat=g.sel('mode')==='podaci',mu0=g.num('mu0'),sg=g.num('sig',{gt:0}),alt=g.sel('alt'),al=g.num('alpha',{gt:0,max:0.5});let pre,n,xb;
   if(dat){const X=g.vec('podaci',{min:1});n=X.length;xb=sum(X)/n;pre=`x <- ${rv(X)}\nn <- length(x); xbar <- mean(x)`;}else{n=g.num('n',{int:true,min:1});xb=g.num('xb');pre=`n <- ${n}; xbar <- ${xb}`;}
   return{code:`${pre}\nsigma <- ${sg}; mu0 <- ${mu0}; alpha <- ${al}; alt <- "${alt}"\nz <- sqrt(n) * (xbar - mu0) / sigma\np <- switch(alt, two.sided = 2 * pnorm(-abs(z)), greater = pnorm(z, lower.tail = FALSE), less = pnorm(z))\ncrit <- switch(alt, two.sided = qnorm(1 - alpha / 2), greater = qnorm(1 - alpha), less = -qnorm(1 - alpha))\ncat("x̄ =", xbar, " z =", z, " p-vrijednost =", p, " kritična vrijednost =", crit, "\\n")`,
   hidden:`H("xb", xbar); H("z", z); H("p", p); H("crit", crit)`,
   tex(v){const z=v.x('z'),p=v.x('p'),xb2=v.x('xb'),h=hyp(alt,mu0);return{analiza:[L`Jedan uzorak iz normalne razdiobe, \(\sigma=${F(sg)}\) poznata ⇒ Z-test. \(n=${n},\ \bar x=${F(xb2)},\ \mu_0=${F(mu0)},\ \alpha=${F(al)}\).`,L`Hipoteze: \(${h[0]},\ ${h[1]}\)`],formula:[L`Z=\frac{\sqrt n\,(\bar X_n-\mu_0)}{\sigma}\sim N(0,1)\ \text{ako vrijedi }H_0`],
   steps:[L`z=\frac{\sqrt{${n}}\,(${F(xb2)}-${FP(mu0)})}{${F(sg)}}=${F(z)}`,critTex(alt,'z',0,al,v.x('crit')),decide(p,al)],result:L`z=${F(z)},\quad p=${F(p)}\ \Rightarrow\ ${p<al?'\\text{odbacujemo }H_0':'\\text{ne odbacujemo }H_0'}`};}};}},
 {id:'ttest2',lbl:'Dvouzorkovni (Welchov) t-test',fields:[vecIn('x','Uzorak 1','1.108, 1.009, 1.042, 1.053, 0.969, 1.002, 0.9688, 1.019, 1.062, 1.032'),vecIn('y','Uzorak 2','1.072, 0.977, 1.062, 1.044, 1.069, 1.029, 0.979, 1.096, 1.079, 0.999'),S('alt','Alternativa (μ₁ − μ₂)',ALT,'two.sided'),N('alpha','Razina značajnosti α',0.05,undefined,undefined,'Testira jednakost očekivanja dvaju nezavisnih uzoraka bez pretpostavke o jednakosti varijanci (Welchova korekcija).')],
  run(g){const x=g.vec('x',{min:2}),y=g.vec('y',{min:2}),alt=g.sel('alt'),al=g.num('alpha',{gt:0,max:0.5});
   return{code:`x <- ${rv(x)}\ny <- ${rv(y)}\nalpha <- ${al}\nres <- t.test(x, y, alternative = "${alt}", conf.level = 1 - alpha)\nprint(res)`,
   hidden:`H("n1", length(x)); H("n2", length(y)); H("m1", mean(x)); H("m2", mean(y)); H("s1", sd(x)); H("s2", sd(y)); H("t", res$statistic); H("df", res$parameter); H("p", res$p.value); H("ci", res$conf.int)`,
   tex(v){const t=v.x('t'),p=v.x('p'),h=hyp(alt,0,'\\mu_1-\\mu_2');return{analiza:[L`Dva nezavisna uzorka (\(n_1=${x.length},\ n_2=${y.length}\)), nepoznate (različite) varijance ⇒ Welchov t-test.`,L`Hipoteze: \(${h[0]},\ ${h[1]}\)`],formula:[L`T=\frac{\bar X_1-\bar X_2}{\sqrt{S_1^2/n_1+S_2^2/n_2}}\ \approx t(\nu)`],
   steps:[L`\bar x_1=${F(v.x('m1'))},\ s_1=${F(v.x('s1'))};\quad \bar x_2=${F(v.x('m2'))},\ s_2=${F(v.x('s2'))}`,L`t=\frac{${F(v.x('m1'))}-${FP(v.x('m2'))}}{\sqrt{\frac{${F(v.x('s1'))}^2}{${x.length}}+\frac{${F(v.x('s2'))}^2}{${y.length}}}}=${F(t)},\quad \nu\approx${F(v.x('df'))}`,decide(p,al)],result:L`t=${F(t)},\ p=${F(p)}\Rightarrow ${p<al?'\\text{odbacujemo }H_0':'\\text{ne odbacujemo }H_0'}`};}};}},
 {id:'reg',lbl:'Linearna regresija y = α + βx',fields:[T('x','x (nezavisna varijabla)','4, 8, 12, 16, 20'),T('y','y (zavisna varijabla)','40, 60, 75, 80, 90'),N('x0','x₀ za predviđanje (neobavezno)','12',undefined,undefined,'Procjena parametara pravca y = α + βx metodom najmanjih kvadrata. β je nagib pravca, a α odsječak na y-osi.')],
  run(g){const x=g.vec('x',{min:2}),y=g.vec('y',{min:2}),x0=g.numOpt('x0');if(x.length!==y.length)g.bad('y','x i y moraju imati isti broj vrijednosti');if(new Set(x).size<2)g.bad('x','x vrijednosti ne smiju biti sve jednake');
   return{code:`x <- ${rv(x)}\ny <- ${rv(y)}\nn <- length(x)\nfit <- lm(y ~ x)              # metoda najmanjih kvadrata\nprint(fit)\nSxx <- sum((x - mean(x))^2); Syy <- sum((y - mean(y))^2); Sxy <- sum((x - mean(x)) * (y - mean(y)))\nbeta <- Sxy / Sxx; alpha <- mean(y) - beta * mean(x)\nr <- cor(x, y)\ncat("Sxx =", Sxx, " Syy =", Syy, " Sxy =", Sxy, "\\n")\ncat("alpha =", alpha, " beta =", beta, "\\n")\ncat("r =", r, " R^2 =", r^2, "\\n")${x0!==null?`\nx0 <- ${x0}\ncat("Predviđena vrijednost y(x0) =", alpha + beta * x0, "\\n")`:''}`,
   hidden:`H("xb", mean(x)); H("yb", mean(y)); H("Sxx", Sxx); H("Syy", Syy); H("Sxy", Sxy); H("beta", beta); H("alpha", alpha); H("r", r)${x0!==null?'; H("pred", alpha + beta * x0)':''}`,
   tex(v){const b=v.x('beta'),a=v.x('alpha'),r=v.x('r'),st=[L`\bar x=${F(v.x('xb'))},\quad \bar y=${F(v.x('yb'))}`,L`S_{xx}=\sum(x_i-\bar x)^2=${F(v.x('Sxx'))},\quad S_{xy}=\sum(x_i-\bar x)(y_i-\bar y)=${F(v.x('Sxy'))},\quad S_{yy}=${F(v.x('Syy'))}`,L`\hat\beta=\frac{${F(v.x('Sxy'))}}{${F(v.x('Sxx'))}}=${F(b)}`,L`\hat\alpha=${F(v.x('yb'))}-${FP(b)}\cdot${FP(v.x('xb'))}=${F(a)}`,L`r=\frac{${F(v.x('Sxy'))}}{\sqrt{${F(v.x('Sxx'))}\cdot${F(v.x('Syy'))}}}=${F(r)},\quad r^2=${F(r*r)}`];
    if(x0!==null)st.push(L`\hat y(${F(x0)})=${F(a)}+${FP(b)}\cdot${F(x0)}=${F(v.x('pred'))}`);
    return{analiza:[L`Uparenih podataka: \(n=${x.length}\). Model: \(Y_i=\alpha+\beta x_i+\epsilon_i\) s \(E\epsilon_i=0\), jednakom varijancom i nekoreliranim pogreškama.`],formula:[L`\hat\beta=\frac{S_{xy}}{S_{xx}},\quad \hat\alpha=\bar y-\hat\beta\bar x,\quad r=\frac{S_{xy}}{\sqrt{S_{xx}S_{yy}}}`],steps:st,result:L`\hat y=${F(a)}${b<0?'':'+'}${F(b)}\,x,\qquad r=${F(r)}`};},
   chart:v=>chartScatter(x,y,v.x('alpha'),v.x('beta'))};}},
 {id:'pearson',lbl:'Pearsonov koeficijent korelacije i test ρ = 0',fields:[T('x','x','100, 110, 120, 130, 140, 150'),T('y','y','45, 52, 50, 60, 62, 68'),N('alpha','Razina značajnosti α',0.05,undefined,undefined,'Pearsonov r mjeri jačinu i smjer linearne povezanosti dviju kontinuiranih varijabli (-1 ≤ r ≤ 1). Testira se hipoteza H_0: ρ = 0.')],
  run(g){const x=g.vec('x',{min:3}),y=g.vec('y',{min:3}),al=g.num('alpha',{gt:0,max:0.5});if(x.length!==y.length)g.bad('y','x i y moraju imati isti broj vrijednosti');if(new Set(x).size<2)g.bad('x','x varijabla ne smije biti konstantna');if(new Set(y).size<2)g.bad('y','y varijabla ne smije biti konstantna');
   return{code:`x <- ${rv(x)}\ny <- ${rv(y)}\nn <- length(x)\nSxx <- sum((x - mean(x))^2); Syy <- sum((y - mean(y))^2); Sxy <- sum((x - mean(x)) * (y - mean(y)))\nr <- cor(x, y)\nct <- cor.test(x, y)\nprint(ct)\ncat("r =", r, "\\n")`,
   hidden:`H("Sxx", Sxx); H("Syy", Syy); H("Sxy", Sxy); H("r", r); H("t", ct$statistic); H("df", ct$parameter); H("p", ct$p.value); H("beta", Sxy / Sxx); H("alpha", mean(y) - Sxy / Sxx * mean(x))`,
   tex(v){const r=v.x('r'),p=v.x('p'),n=x.length,ar=Math.abs(r),js=ar>=.75?'visoka':ar>=.3?'umjerena':'niska';return{analiza:[L`Uparenih podataka: \(n=${n}\). Testira se \(H_0:\rho=0\) protiv \(H_1:\rho\ne0\).`],formula:[L`r=\frac{S_{xy}}{\sqrt{S_{xx}S_{yy}}},\qquad T=\frac{r\sqrt{n-2}}{\sqrt{1-r^2}}\sim t(n-2)`],
   steps:[L`r=\frac{${F(v.x('Sxy'))}}{\sqrt{${F(v.x('Sxx'))}\cdot${F(v.x('Syy'))}}}=${F(r)}\quad(\text{${r>=0?'pozitivna':'negativna'}, ${js} povezanost})`,L`t=\frac{${F(r)}\sqrt{${n-2}}}{\sqrt{1-${F(r*r)}}}=${F(v.x('t'))},\quad df=${n-2}`,decide(p,al),L`\text{Napomena: korelacija mjeri povezanost, a ne uzročnost.}`],result:L`r=${F(r)},\quad p=${F(p)}`};},
   chart:v=>chartScatter(x,y,v.x('alpha'),v.x('beta'))};}}]}
];

/* ===================== OBJAŠNJENJA R FUNKCIJA ===================== */
const FN={table:'prebrojava pojavljivanja svake vrijednosti (tablica frekvencija); table(x)/length(x) daje relativne frekvencije.',cumsum:'kumulativni zbroj, npr. kumulativne relativne frekvencije.',mean:'aritmetička sredina podataka.',median:'medijan (srednji podatak sortiranog niza).',var:'uzoračka varijanca s dijeljenjem s n − 1.',sd:'uzoračka standardna devijacija, √var.',range:'najmanja i najveća vrijednost; diff(range(x)) je raspon.',quantile:'percentili/kvartili; type = 2 odgovara definiciji iz skripte (sredina dvaju podataka kad np je cijeli broj).',summary:'min, kvartili (type 7), medijan i sredina.',sort:'sortira podatke uzlazno.',choose:'binomni koeficijent C(n, k).',factorial:'faktorijel n!.',prod:'umnožak elemenata vektora (npr. padajući faktorijel).',pbirthday:'vjerojatnost da barem dvije od n osoba imaju rođendan isti dan.',dbinom:'binomna vjerojatnost P(X = k).',pbinom:'binomna funkcija distribucije P(X ≤ k).',dpois:'Poissonova vjerojatnost P(X = k).',ppois:'Poissonova funkcija distribucije.',dgeom:'geometrijska razdioba u R-u broji neuspjehe prije prvog uspjeha, zato k − 1.',pgeom:'geometrijska funkcija distribucije (broj neuspjeha).',dhyper:'hipergeometrijska P(X = k): dhyper(k, plavih, crvenih, n).',phyper:'hipergeometrijska funkcija distribucije.',dunif:'gustoća uniformne razdiobe.',punif:'funkcija distribucije uniformne razdiobe.',qunif:'kvantili uniformne razdiobe.',dnorm:'gustoća normalne razdiobe (parametri: sredina i standardna devijacija).',pnorm:'funkcija distribucije normalne razdiobe Φ.',qnorm:'kvantilna funkcija Φ⁻¹.',dexp:'gustoća eksponencijalne razdiobe.',pexp:'funkcija distribucije eksponencijalne razdiobe.',qexp:'kvantili eksponencijalne razdiobe.',pt:'funkcija distribucije t-razdiobe (za p-vrijednosti).',qt:'kvantili t-razdiobe (kritične vrijednosti).','t.test':'t-test o očekivanju jednog uzorka ili Welchov test za dva uzorka.','cor.test':'test hipoteze ρ = 0 za Pearsonovu korelaciju.',lm:'linearni model y ~ x metodom najmanjih kvadrata.',cor:'Pearsonov koeficijent korelacije.',outer:'vanjski umnožak vektora (svi parovi xⱼ·yᵢ).',colSums:'zbrojevi stupaca matrice (marginalna razdioba od X).',rowSums:'zbrojevi redaka matrice (marginalna razdioba od Y).',sum:'zbroj elemenata.',switch:'bira izraz prema odabranoj opciji.',ecdf:'računa empirijsku funkciju distribucije (ECDF) za uzorak.',exp:'eksponencijalna funkcija e^x (koristi se u stabilnom računu rođendanskog problema).',log:'prirodni logaritam.'};
function funcsUsed(code){return Object.keys(FN).filter(k=>new RegExp('(^|[^\\w.])'+k.replace('.','\\.')+'\\s*\\(').test(code)).map(k=>[k,FN[k]]);}

/* ===================== PRIPREMA / ZAVRŠETAK ===================== */
function prepare(prob,vals){const g=makeG(vals,prob.fields);const r=prob.run(g);return{r,script:PRE+r.code+'\n'+r.hidden+'\n',rcode:r.code};}
function finalize(prep,raw){const {V,text}=parseOut(raw),v=mkV(V),t=prep.r.tex(v);
 return{...t,rcode:prep.rcode,out:text,funcs:funcsUsed(prep.rcode),chart:prep.r.chart?prep.r.chart(v):''};}
</script>

<script type="module">
import {WebR} from 'https://webr.r-wasm.org/latest/webr.mjs';
const $=id=>document.getElementById(id),st=$('status'),go=$('go');
const webR=new WebR();let ready=false;
(async()=>{try{await webR.init();ready=true;go.disabled=false;st.textContent='R je spreman ✔';st.className='ok';}
 catch(e){st.textContent='Greška pri pokretanju webR-a: '+e.message+' (potrebna je internetska veza i moderan preglednik)';st.className='err';}})();
async function runR(script){const sh=await new webR.Shelter();try{const r=await sh.captureR(script,{withAutoprint:false});return r.output.filter(o=>o.type==='stdout'||o.type==='stderr').map(o=>o.data).join('\n');}finally{sh.purge();}}
const esc=escH;
let cat,prob;
function fillProbs(){const c=CATS.find(x=>x.id===$('cat').value);$('prob').innerHTML=c.probs.map(p=>`<option value="${p.id}">${esc(p.lbl)}</option>`).join('');buildForm();}
function buildForm(){cat=CATS.find(x=>x.id===$('cat').value);prob=cat.probs.find(p=>p.id===$('prob').value);
 $('form').innerHTML=prob.fields.map(f=>{const id='f_'+f.id,h=f.hint?` <span class="hint">${esc(f.hint)}</span>`:'';
  const tt=f.tt?`<span class="tooltip">ⓘ<span class="tt-text">${esc(f.tt)}</span></span>`:'';
  let inp;
  if(f.kind==='sel')inp=`<select id="${id}">${f.opts.map(o=>`<option value="${o[0]}"${o[0]===f.def?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
  else if(f.kind==='area')inp=`<textarea id="${id}">${esc(f.def)}</textarea>`;
  else inp=`<input id="${id}" type="text" value="${esc(f.def)}" autocomplete="off">`;
  return `<div data-f="${f.id}"><label for="${id}">${esc(f.lbl)}${tt}${h}</label>${inp}</div>`;}).join('');
 prob.fields.forEach(f=>$('f_'+f.id).addEventListener('input',vis));vis();$('out').innerHTML='';}
const vals=()=>Object.fromEntries(prob.fields.map(f=>[f.id,$('f_'+f.id).value]));
function vis(){const v=vals();prob.fields.forEach(f=>{document.querySelector(`[data-f="${f.id}"]`).style.display=(!f.show||f.show(v))?'':'none';});}
const card=(n,t,b)=>`<div class="card step"><h2>Korak ${n}: ${t}</h2>${b}</div>`;
const disp=a=>a.map(s=>`<div>\\[${esc(s)}\\]</div>`).join('');
async function solve(){
 const out=$('out');go.disabled=true;out.innerHTML='<div class="card">Računam u R-u…</div>';
 try{const v=vals(),sv={};prob.fields.forEach(f=>{if(!f.show||f.show(v))sv[f.id]=v[f.id];});
  const prep=prepare(prob,sv),raw=await runR(prep.script),r=finalize(prep,raw);
  if(window.MathJax&&MathJax.typesetClear)MathJax.typesetClear([out]);
  out.innerHTML=card(1,'Analiza problema',`<p><b>${esc(prob.lbl)}</b></p>${r.analiza.map(a=>`<p>${esc(a)}</p>`).join('')}`)
   +card(2,'Matematička formula',disp(r.formula))
   +card(3,'Postupno uvrštavanje vrijednosti',disp(r.steps))
   +card(4,'Konačni rezultat',`<div class="res">\\[${esc(r.result)}\\]</div>${r.chart}`)
   +card(5,'Izvršeni R kod i objašnjenje',`<pre>${esc(r.rcode)}</pre><b>Ispis iz R-a:</b><pre class="out">${esc(r.out||'(nema ispisa)')}</pre>${r.funcs.length?'<b>Korištene R funkcije:</b>'+r.funcs.map(([k,d])=>`<div class="fn"><code>${esc(k)}()</code> – ${esc(d)}</div>`).join(''):''}`);
  if(window.MathJax&&MathJax.typesetPromise){await MathJax.startup.promise;await MathJax.typesetPromise([out]);}
 }catch(e){out.innerHTML=`<div class="card"><p class="err">Pogreška: ${esc(e.message||e)}</p></div>`;}
 go.disabled=!ready;}
$('cat').innerHTML=CATS.map(c=>`<option value="${c.id}">${esc(c.lbl)}</option>`).join('');
$('cat').addEventListener('change',fillProbs);$('prob').addEventListener('change',buildForm);go.addEventListener('click',solve);fillProbs();
</script>
</body>
